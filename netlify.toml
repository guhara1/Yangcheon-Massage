# Netlify 배포 설정
# 정적 HTML 사이트 — 생성물(index.html, sitemap.xml 등)이 이미 저장소 루트에 커밋되어 있어
# 별도 빌드 없이 루트를 그대로 게시한다.
[build]
  publish = "."
  command = ""

# 운영(canonical) 도메인은 pages.dev 이며, netlify.app 은 동일 콘텐츠를 서빙하는 미러다.
# 각 페이지의 canonical 태그가 pages.dev 를 가리키므로 중복 색인 문제는 없다.

# 정적 자산 캐시
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
