# Netlify 배포 설정
# 정적 HTML 사이트 — 생성물(index.html, sitemap.xml 등)이 이미 저장소 루트에 커밋되어 있어
# 별도 빌드 없이 루트를 그대로 게시한다.
[build]
  publish = "."
  command = ""

# 운영(canonical) 도메인은 yangcheon-massage.netlify.app 이다.
# canonical·og·sitemap·feed·robots 의 도메인은 content/site.py 의 BASE_URL 로 일괄 관리된다.

# 정적 자산 캐시
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
